<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather page</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Weather page que prob no acabe</h1>
    <div class="plantilla">
        <div class="buscar">
            <input type="text" placeholder="Ingrese ciudad" spellcheck="false">
            <button> <img src="images/search.png" alt=""></button>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="ciudad">Bani</h2>
            <div class="detalles">
                <div class="colum">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humedad">50%</p>
                        <p>Humedad</p>
                    </div>
                </div>
                <div class="colum">
                    <img src="images/wind.png">
                    <div>
                        <p class="viento">15 km/h</p>
                        <p>Velocidad de viento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
